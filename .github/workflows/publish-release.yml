name: Publish verified stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix; must equal the checked-out source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pixnya-stable-publication-${{ inputs.version }}
  cancel-in-progress: false

env:
  PIXNYA_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment:
      name: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install the pinned Android signature verifier
        run: sdkmanager "build-tools;36.0.0"
      - name: Require the main stable source
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Stable publication can only run from main; got $GITHUB_REF" >&2
            exit 1
          }
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$SOURCE_VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable 1.x-or-later versions can be published; got $SOURCE_VERSION" >&2
            exit 1
          }
          test "$SOURCE_VERSION" = "$PIXNYA_RELEASE_VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$SOURCE_VERSION"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$SOURCE_VERSION"
          test "$(node -e "const fs=require('node:fs'); const m=fs.readFileSync('Cargo.toml','utf8').match(/\[workspace\.package\][\s\S]*?version\s*=\s*\"([^\"]+)\"/); if(!m) process.exit(2); process.stdout.write(m[1]);")" = "$SOURCE_VERSION"
      - name: Require the official repository to be anonymously readable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" > "$RUNNER_TEMP/repository.json"
          REPOSITORY_FILE="$RUNNER_TEMP/repository.json" node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync(process.env.REPOSITORY_FILE, "utf8"));
            if (
              metadata.full_name !== process.env.GITHUB_REPOSITORY ||
              metadata.private !== false ||
              metadata.visibility !== "public"
            ) {
              throw new Error("stable releases require the official repository to be anonymously readable");
            }
          '
      - name: Download the existing signed Draft and its trust metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir candidate
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${PIXNYA_RELEASE_VERSION}" > "$RUNNER_TEMP/candidate-tag.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases-pages.json"
          RELEASES_FILE="$RUNNER_TEMP/releases-pages.json" RELEASE_FILE="$RUNNER_TEMP/candidate-release.json" \
            ASSET_PLAN_FILE="$RUNNER_TEMP/candidate-assets.tsv" TAG_FILE="$RUNNER_TEMP/candidate-tag.json" node -e '
            const fs = require("node:fs");
            const pages = JSON.parse(fs.readFileSync(process.env.RELEASES_FILE, "utf8"));
            const matches = pages.flat().filter(
              (release) => release.tag_name === `v${process.env.PIXNYA_RELEASE_VERSION}`,
            );
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one Release for the stable tag, found ${matches.length}`);
            }
            const [release] = matches;
            const tag = JSON.parse(fs.readFileSync(process.env.TAG_FILE, "utf8"));
            if (release.draft !== true) throw new Error("Only an existing Draft Release can be finalized");
            if (tag.object?.type !== "commit" || !/^[0-9a-f]{40}$/i.test(tag.object?.sha ?? "")) {
              throw new Error("The stable tag does not point directly to a valid source commit");
            }
            if (!Number.isInteger(release.id) || release.id <= 0) {
              throw new Error("The Draft Release has no stable ID");
            }
            const assets = release.assets ?? [];
            if (assets.length !== 10) {
              throw new Error(`Expected exactly 10 Draft assets, found ${assets.length}`);
            }
            const names = new Set();
            const plan = assets.map((asset) => {
              if (!Number.isInteger(asset.id) || asset.id <= 0) throw new Error("Draft asset ID is invalid");
              if (!/^[A-Za-z0-9._+-]+$/.test(asset.name) || names.has(asset.name)) {
                throw new Error(`Draft asset name is unsafe or duplicated: ${asset.name}`);
              }
              names.add(asset.name);
              return `${asset.id}\t${asset.name}`;
            });
            fs.writeFileSync(process.env.RELEASE_FILE, `${JSON.stringify(release)}\n`);
            fs.writeFileSync(process.env.ASSET_PLAN_FILE, `${plan.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `PIXNYA_DRAFT_RELEASE_ID=${release.id}\n`);
          '
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > "candidate/${ASSET_NAME}"
          done < "$RUNNER_TEMP/candidate-assets.tsv"
      - name: Strictly validate release notes, assets, checksums, and provenance
        shell: bash
        run: |
          VERIFICATION_BUNDLE="candidate/pixnya-${PIXNYA_RELEASE_VERSION}-verification.tar.gz"
          EXPECTED_MEMBERS=(
            BUILD-PROVENANCE.txt
            LICENSE.txt
            pixnya-${PIXNYA_RELEASE_VERSION}-android-build-tools-osv.json
            pixnya-${PIXNYA_RELEASE_VERSION}-android-gradle-dependencies.json
            pixnya-${PIXNYA_RELEASE_VERSION}-android-runtime.spdx.json
            pixnya-${PIXNYA_RELEASE_VERSION}-source.tar.gz
            pixnya-${PIXNYA_RELEASE_VERSION}-third-party-licenses.tar.gz
            pixnya-${PIXNYA_RELEASE_VERSION}.spdx.json
            PixNya_${PIXNYA_RELEASE_VERSION}_amd64.AppImage.sig
            PixNya_${PIXNYA_RELEASE_VERSION}_arm64-setup.exe.sig
            PixNya_${PIXNYA_RELEASE_VERSION}_x64-setup.exe.sig
            THIRD_PARTY_NOTICES.md
          )
          mapfile -t BUNDLED_MEMBERS < <(tar -tzf "$VERIFICATION_BUNDLE" | sort)
          mapfile -t SORTED_EXPECTED_MEMBERS < <(printf '%s\n' "${EXPECTED_MEMBERS[@]}" | sort)
          test "${BUNDLED_MEMBERS[*]}" = "${SORTED_EXPECTED_MEMBERS[*]}" || {
            echo "The verification bundle does not contain the exact reviewed evidence set" >&2
            exit 1
          }
          tar -xOf "$VERIFICATION_BUNDLE" BUILD-PROVENANCE.txt > "$RUNNER_TEMP/candidate-provenance.txt"
          CANDIDATE_SOURCE_SHA="$(sed -n 's/^source_commit=//p' "$RUNNER_TEMP/candidate-provenance.txt")"
          [[ "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "The verified candidate provenance has no valid source commit" >&2
            exit 1
          }
          echo "PIXNYA_RELEASE_SOURCE_SHA=${CANDIDATE_SOURCE_SHA,,}" >> "$GITHUB_ENV"
          node scripts/validate-release-candidate.mjs \
            --release-json "$RUNNER_TEMP/candidate-release.json" \
            --tag-json "$RUNNER_TEMP/candidate-tag.json" \
            --assets-dir candidate \
            --version "$PIXNYA_RELEASE_VERSION" \
            --commit "$CANDIDATE_SOURCE_SHA" \
            --workflow-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --provenance-file "$RUNNER_TEMP/candidate-provenance.txt" \
            --snapshot-output "$RUNNER_TEMP/candidate-snapshot.txt"
      - name: Install the independent signature verifier
        shell: bash
        run: |
          MINISIGN_ARCHIVE="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$MINISIGN_ARCHIVE" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          printf '%s  %s\n' \
            9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73 \
            "$MINISIGN_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$MINISIGN_ARCHIVE" -C "$RUNNER_TEMP" \
            minisign-linux/x86_64/minisign
          mkdir -p "$RUNNER_TEMP/pixnya-release-tools"
          install -m 0755 \
            "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            "$RUNNER_TEMP/pixnya-release-tools/minisign"
          echo "$RUNNER_TEMP/pixnya-release-tools" >> "$GITHUB_PATH"
      - name: Reverify desktop archives and the Android manifest
        shell: bash
        env:
          PIXNYA_UPDATER_PUBKEY: ${{ secrets.PIXNYA_UPDATER_PUBKEY }}
          PIXNYA_ANDROID_UPDATE_PUBKEY: ${{ secrets.PIXNYA_ANDROID_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PIXNYA_UPDATER_PUBKEY"
          test -n "$PIXNYA_ANDROID_UPDATE_PUBKEY"
          DESKTOP_PUBLIC_KEY="$RUNNER_TEMP/desktop-updater.pub"
          ANDROID_PUBLIC_KEY="$RUNNER_TEMP/android-update-manifest.pub"
          printf '%s' "$PIXNYA_UPDATER_PUBKEY" | base64 --decode > "$DESKTOP_PUBLIC_KEY"
          printf '%s' "$PIXNYA_ANDROID_UPDATE_PUBKEY" | base64 --decode > "$ANDROID_PUBLIC_KEY"

          WINDOWS_X64_ARCHIVE="candidate/PixNya_${PIXNYA_RELEASE_VERSION}_x64-setup.exe"
          WINDOWS_ARM64_ARCHIVE="candidate/PixNya_${PIXNYA_RELEASE_VERSION}_arm64-setup.exe"
          LINUX_ARCHIVE="$(find candidate -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -f "$WINDOWS_X64_ARCHIVE" && test -f "$WINDOWS_ARM64_ARCHIVE" && test -n "$LINUX_ARCHIVE"
          WINDOWS_X64_SIGNATURE_FILE="$RUNNER_TEMP/windows-x64-updater.minisig" \
            WINDOWS_ARM64_SIGNATURE_FILE="$RUNNER_TEMP/windows-arm64-updater.minisig" \
            LINUX_SIGNATURE_FILE="$RUNNER_TEMP/linux-updater.minisig" node -e '
              const fs = require("node:fs");
              const manifest = JSON.parse(fs.readFileSync("candidate/latest.json", "utf8"));
              for (const [target, output] of [
                ["windows-x86_64", process.env.WINDOWS_X64_SIGNATURE_FILE],
                ["windows-aarch64", process.env.WINDOWS_ARM64_SIGNATURE_FILE],
                ["linux-x86_64", process.env.LINUX_SIGNATURE_FILE],
              ]) {
                const encoded = manifest.platforms?.[target]?.signature;
                if (typeof encoded !== "string" || encoded === "") {
                  throw new Error(`Missing embedded updater signature: ${target}`);
                }
                const signature = Buffer.from(encoded, "base64");
                if (signature.toString("base64") !== encoded || !signature.toString("utf8").startsWith("untrusted comment:")) {
                  throw new Error(`Invalid embedded updater signature: ${target}`);
                }
                fs.writeFileSync(output, signature);
              }
            '
          minisign -Vm "$WINDOWS_X64_ARCHIVE" -x "$RUNNER_TEMP/windows-x64-updater.minisig" -p "$DESKTOP_PUBLIC_KEY"
          minisign -Vm "$WINDOWS_ARM64_ARCHIVE" -x "$RUNNER_TEMP/windows-arm64-updater.minisig" -p "$DESKTOP_PUBLIC_KEY"
          minisign -Vm "$LINUX_ARCHIVE" -x "$RUNNER_TEMP/linux-updater.minisig" -p "$DESKTOP_PUBLIC_KEY"
          minisign -Vm candidate/android-latest.json -x candidate/android-latest.json.minisig -p "$ANDROID_PUBLIC_KEY"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for ABI in arm64-v8a armeabi-v7a; do
            ANDROID_APK="candidate/pixnya-${PIXNYA_RELEASE_VERSION}-android-${ABI}.apk"
            test -f "$ANDROID_APK"
            APK_CERTIFICATE_SHA256="$("$APKSIGNER" verify --verbose --print-certs "$ANDROID_APK" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(":", "", $2); print tolower($2); exit}')"
            MANIFEST_CERTIFICATE_SHA256="$(ABI="$ABI" node -p '
              const manifest = JSON.parse(require("node:fs").readFileSync("candidate/android-latest.json", "utf8"));
              const matches = manifest.artifacts.filter((artifact) => artifact.abi === process.env.ABI);
              if (matches.length !== 1) throw new Error(`Expected exactly one Android manifest artifact for ${process.env.ABI}`);
              matches[0].certificateSha256.toLowerCase();
            ')"
            test "${#APK_CERTIFICATE_SHA256}" -eq 64
            test "$APK_CERTIFICATE_SHA256" = "$MANIFEST_CERTIFICATE_SHA256" || {
              echo "$ABI APK certificate does not match the signed Android update manifest" >&2
              exit 1
            }
          done
      - name: "Fail: The Draft changed while it was being verified"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${PIXNYA_RELEASE_VERSION}" > "$RUNNER_TEMP/final-tag.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${PIXNYA_DRAFT_RELEASE_ID}" > "$RUNNER_TEMP/final-release.json"
          node scripts/validate-release-candidate.mjs \
            --release-json "$RUNNER_TEMP/final-release.json" \
            --tag-json "$RUNNER_TEMP/final-tag.json" \
            --assets-dir candidate \
            --version "$PIXNYA_RELEASE_VERSION" \
            --commit "$PIXNYA_RELEASE_SOURCE_SHA" \
            --workflow-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --provenance-file "$RUNNER_TEMP/candidate-provenance.txt" \
            --expect-snapshot "$RUNNER_TEMP/candidate-snapshot.txt"
      - name: Publish the verified stable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$PIXNYA_DRAFT_RELEASE_ID"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${PIXNYA_DRAFT_RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true > "$RUNNER_TEMP/published-release.json"
          PUBLISHED_FILE="$RUNNER_TEMP/published-release.json" node -e '
            const fs = require("node:fs");
            const release = JSON.parse(fs.readFileSync(process.env.PUBLISHED_FILE, "utf8"));
            if (
              release.tag_name !== `v${process.env.PIXNYA_RELEASE_VERSION}` ||
              release.draft !== false ||
              release.prerelease !== false
            ) {
              throw new Error("The stable Release was not published as expected");
            }
          '
      - name: Remove downloaded artifacts and public-key files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- \
            "$RUNNER_TEMP/desktop-updater.pub" \
            "$RUNNER_TEMP/android-update-manifest.pub" \
            "$RUNNER_TEMP/candidate-provenance.txt" \
            "$RUNNER_TEMP/windows-x64-updater.minisig" \
            "$RUNNER_TEMP/windows-arm64-updater.minisig" \
            "$RUNNER_TEMP/linux-updater.minisig"
