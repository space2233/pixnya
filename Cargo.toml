[workspace]
members = [
    "crates/api",
    "crates/auth",
    "crates/domain",
    "crates/diagnostic-log",
    "crates/download-queue",
    "crates/library",
    "crates/local-catalog",
    "crates/local-history",
    "crates/local-backup",
    "crates/media-cache",
    "crates/network",
    "crates/storage-policy",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.4.2"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
