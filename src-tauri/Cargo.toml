[package]
name = "pixnya"
version.workspace = true
description = "PixNya, an unofficial local-first Pixiv client"
edition.workspace = true
license.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pixnya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
pixiv-client-api = { path = "../crates/api" }
pixiv-client-auth = { path = "../crates/auth" }
pixiv-client-domain = { path = "../crates/domain" }
pixiv-client-diagnostic-log = { path = "../crates/diagnostic-log" }
pixiv-client-download-queue = { path = "../crates/download-queue" }
pixiv-client-library = { path = "../crates/library" }
pixiv-client-local-catalog = { path = "../crates/local-catalog" }
pixiv-client-local-history = { path = "../crates/local-history" }
pixiv-client-media-cache = { path = "../crates/media-cache" }
pixiv-client-network = { path = "../crates/network" }
pixiv-client-storage-policy = { path = "../crates/storage-policy" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
base64 = "0.22"
minisign-verify = "0.2.5"
semver = "1"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"
zip = { version = "4.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
