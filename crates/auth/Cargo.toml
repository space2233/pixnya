[package]
name = "pixiv-client-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
md5 = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "rustls", "system-proxy"] }
serde = { workspace = true }
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "macros"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
